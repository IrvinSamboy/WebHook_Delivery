[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "webhook-relay"
version = "0.1.0"
description = "Servicio de entrega confiable de webhooks"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=50,<60",
    "httpx2>=2.16,<3",
    "celery[redis]>=5.6,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tests/integration"]
# Los de integración necesitan Postgres: se ejecutan aparte con `make test-integration`.
addopts = "-m 'not integration'"
markers = ["integration: necesita PostgreSQL (make test-integration)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: estilo · F: errores (imports sin usar, nombres no definidos) · I: orden de imports
# B: trampas comunes (bugbear) · UP: sintaxis moderna · SIM: simplificaciones
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las genera Alembic con su propio estilo.
"migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["relay"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["relay"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Celery no publica tipos.
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true
